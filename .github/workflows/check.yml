name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Must precede setup-node: `cache: pnpm` needs the pnpm binary on PATH.
      # Both actions read package.json — the pinned packageManager and engines.node.
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build

      # `build` validates the bundle but never the Worker config. astro build
      # generates dist/server/wrangler.json and wrangler deploys that, so a bad
      # binding passes every other step and fails only on a real deploy.
      # --dry-run makes no API calls, so it needs no credentials here.
      - run: pnpm exec wrangler deploy --dry-run
